# This tells promptfoo that the "prompt" it will be testing is the
# actual content of your Python file.
prompts:
  - file://src/app.py

# This defines a "provider" that does nothing but simply return
# the prompt it was given. This is how we test the file content directly.
providers:
  - id: 'echo'

tests:
  # --- Fixed Original Tests ---
  - description: "Checks for JSONResponse usage (FastAPI standard)"
    assert:
      - type: contains
        value: "JSONResponse"

  - description: "UAT-LOCKED Check: Output does NOT contain modification of get_activities"
    assert:
      - type: not-contains
        value: "def get_activities"

  - description: "UAT-LOCKED Check: Output does NOT include the existing signup route"
    assert:
      - type: not-contains
        value: "def signup_for_activity"

  # ── Capstone: /api/ask endpoint eval ─────────────────────────────────────
  - description: "Capstone: ask endpoint has correct function name"
    assert:
      - type: contains
        value: "def ask"

  - description: "Capstone: ask endpoint uses correct route"
    assert:
      - type: contains
        value: "/api/ask"

  - description: "Capstone: endpoint accepts POST method"
    assert:
      - type: contains
        value: "POST"

  - description: "Capstone: classifier function present"
    assert:
      - type: contains
        value: "classify_query"

  - description: "Capstone: RAG routing for qualitative queries"
    assert:
      - type: contains
        value: "rag"

  - description: "Capstone: Text2SQL routing for quantitative queries"
    assert:
      - type: contains
        value: "text2sql"

  - description: "Capstone: does NOT modify get_activities — UAT-locked"
    assert:
      - type: not-contains
        value: "def get_activities"

  - description: "Capstone: does NOT modify signup — UAT-locked"
    assert:
      - type: not-contains
        # This should check for the function name from your file
        value: "def signup_for_activity"

  - description: "Capstone: returns source field in response"
    assert:
      - type: contains
        # This is fixed to look for the key without specific quotes
        value: "source"

  - description: "Capstone: handles 400 for missing question field"
    assert:
      - type: contains
        value: "400"
